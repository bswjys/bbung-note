<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bb-bod" gradientUnits="userSpaceOnUse" x1="120" y1="150" x2="400" y2="400">
      <stop offset="0" stop-color="#FFFEFA"/>
      <stop offset=".45" stop-color="#FFF6E8"/>
      <stop offset="1" stop-color="#FFE0C2"/>
    </linearGradient>
    <radialGradient id="bb-belly" cx=".5" cy=".38" r=".62">
      <stop offset="0" stop-color="#FFFAF0"/>
      <stop offset="1" stop-color="#FFE9CB" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="bb-cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF9FB1" stop-opacity=".72"/>
      <stop offset="1" stop-color="#FF9FB1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bb-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDF5EA"/>
      <stop offset="1" stop-color="#B4E4D0"/>
    </linearGradient>
    <linearGradient id="bb-peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9DA"/>
      <stop offset="1" stop-color="#FFCCAF"/>
    </linearGradient>
    <filter id="bb-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#E3BE9C" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- 뒤로 사라지는 작은 방귀 구름들 -->
  <g>
    <circle cx="82" cy="188" r="29" fill="url(#bb-mint)"/>
    <circle cx="42" cy="228" r="17" fill="url(#bb-mint)"/>
    <circle cx="442" cy="150" r="29" fill="url(#bb-peach)"/>
    <circle cx="484" cy="192" r="16" fill="url(#bb-peach)"/>
  </g>

  <!-- 발 -->
  <ellipse cx="208" cy="382" rx="26" ry="14" fill="#FFD3B6"/>
  <ellipse cx="308" cy="382" rx="26" ry="14" fill="#FFD3B6"/>

  <!-- 폭신한 구름 몸통 -->
  <g filter="url(#bb-soft)">
    <g fill="url(#bb-bod)">
      <circle cx="150" cy="298" r="62"/>
      <circle cx="252" cy="252" r="90"/>
      <circle cx="352" cy="290" r="68"/>
      <ellipse cx="256" cy="330" rx="154" ry="62"/>
    </g>
  </g>
  <ellipse cx="252" cy="338" rx="114" ry="46" fill="url(#bb-belly)"/>

  <!-- 반짝이 -->
  <path d="M186 212c2 8 5 11 13 13-8 2-11 5-13 13-2-8-5-11-13-13 8-2 11-5 13-13z" fill="#FFFFFF" opacity=".95"/>
  <circle cx="166" cy="250" r="4" fill="#FFFFFF" opacity=".85"/>

  <!-- 볼 -->
  <circle cx="182" cy="330" r="27" fill="url(#bb-cheek)"/>
  <circle cx="330" cy="330" r="27" fill="url(#bb-cheek)"/>

  <!-- 눈 -->
  <ellipse cx="216" cy="300" rx="14.5" ry="17.5" fill="#5B463A"/>
  <ellipse cx="296" cy="300" rx="14.5" ry="17.5" fill="#5B463A"/>
  <circle cx="211" cy="293" r="5.4" fill="#FFFFFF"/>
  <circle cx="291" cy="293" r="5.4" fill="#FFFFFF"/>
  <circle cx="221" cy="307" r="2.9" fill="#FFFFFF" opacity=".85"/>
  <circle cx="301" cy="307" r="2.9" fill="#FFFFFF" opacity=".85"/>

  <!-- 입 -->
  <path d="M242 330c4 9 8 13 14 13s10-4 14-13" fill="none" stroke="#7A5B4A" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M249 343c3 5 11 5 14 0" fill="#FF9DAE" opacity=".9"/>

  <!-- 하트 -->
  <path d="M404 92c-9-13-29-9-29 7 0 13 18 24 29 31 11-7 29-18 29-31 0-16-20-20-29-7z" fill="#FFBFCE"/>
</svg>
